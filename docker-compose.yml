services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: grace
      POSTGRES_PASSWORD: grace
      POSTGRES_DB: grace
    ports:
      - "5432:5432"
    volumes:
      - grace-pg:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grace -d grace"]
      interval: 5s
      retries: 10

  reranker:
    build:
      context: ./services/reranker
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8081/health').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 6

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      reranker:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3001"
      LOG_LEVEL: info
      PUBLIC_BASE_URL: http://localhost:3001
      DATABASE_URL: postgres://grace:grace@postgres:5432/grace
      DATABASE_SSL: "false"
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-AC_dev}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-dev}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-+10000000000}
      LLM_PROVIDER: gemini
      GEMINI_API_KEY: ${GEMINI_API_KEY:?set GEMINI_API_KEY in your shell or .env}
      GEMINI_MODEL: gemini-2.5-flash
      RAG_ENABLED: "true"
      TOOLS_ENABLED: "true"
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      REDIS_URL: redis://redis:6379
      # Hybrid RAG: leave unset to silently fall back to dense-only retrieval.
      RERANKER_URL: http://reranker:8081
    ports:
      - "3001:3001"

volumes:
  grace-pg:
